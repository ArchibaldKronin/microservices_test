services:
  inventory-service:
    build:
      context: ../../..
      dockerfile: deploy/docker/inventory/Dockerfile

    container_name: inventory-service

    ports:
      - ${GRPC_PORT}:50051

    env_file:
      - .env

    environment:
      - IAM_GRPC_HOST=iam-service
      - MONGO_HOST=mongo-inventory

    depends_on:
      mongo-inventory:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

    networks:
      - microservices-net
  
  mongo-inventory:
    image: ${MONGO_IMAGE_NAME}

    container_name: mongo-inventory

    env_file:
      - .env

    environment:
      - MONGO_HOST=mongo-inventory

    ports:
      - ${EXTERNAL_MONGO_PORT}:27017
    volumes:
      - mongo_inventory_data:/data/db

    healthcheck:
      test: 
        [
          "CMD-SHELL",
          # "echo 'db.runCommand({ ping: 1}).ok' | mongosh --quiet -u ${MONGO_INITDB_ROOT_USERNAME} -p ${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase ${MONGO_AUTH_DB}",
          "mongosh --quiet --eval \"db.runCommand({ ping: 1 })\" -u inventory-service-user -p inventory-service-password --authenticationDatabase admin",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - microservices-net

volumes:
  mongo_inventory_data:

networks:
  microservices-net:
    external: true