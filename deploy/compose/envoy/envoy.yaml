admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 8081

static_resources:
  listeners:
  - name: order_api_listener

    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080

    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager  

        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

          stat_prefix: order_api

          # ===============================
          # КОНФИГУРАЦИЯ МАРШРУТИЗАЦИИ
          # ===============================
          route_config:
            name: order_routes

            virtual_hosts:
            - name: order_service

              domains: ["*"]

              routes:
              # С АУТЕНТИФИКАЦИЕЙ
              - match:
                  prefix: "/api/v1/orders"
                route: 
                  cluster: order_api_cluster
                  timeout: 15s

              - match:
                  prefix: "/api/v1/inventory"
                route:
                  cluster: inventory_api_cluster
                  timeout: 15s

              # БЕЗ АУТЕНТИФИКАЦИИ
              - match:
                  prefix: "/api/v1/auth/login"
                route:
                  cluster: iam_api_cluster
                  timeout: 15s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              - match:
                  prefix: "/api/v1/user/register"
                route:
                  cluster: iam_api_cluster
                  timeout: 15s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

              - match:
                  prefix: "/health"
                route: 
                  cluster: order_api_cluster
                  timeout: 15s
                typed_per_filter_config:
                  envoy.filters.http.ext_authz:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                    disabled: true

          http_filters:
          # ⚠️ EXTERNAL AUTHORIZATION (gRPC) - ДО transcoder!
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              
              # ⚠️ ИСПОЛЬЗУЕМ gRPC СЕРВИС (IAM напрямую)
              grpc_service:
                envoy_grpc:
                  cluster_name: iam_grpc_cluster
                timeout: 2s  # Таймаут для gRPC вызова
              
              # КРИТИЧНО: Запрещать доступ если auth сервис недоступен
              failure_mode_allow: false
              
              # Включать тело запроса в авторизацию (для POST/PUT)
              with_request_body:
                max_request_bytes: 8192
                allow_partial_message: true
                pack_as_bytes: false
              
              # Передаем метаданные о запросе
              include_peer_certificate: false
              
              # Заголовки, которые отправляем в auth service
              allowed_headers:
                patterns:
                  - exact: "authorization"    # Bearer token
                  - exact: "cookie"           # Session cookies
                  - exact: "session-uuid"     # Кастомный заголовок
                  - exact: "x-session-id"     # Альтернативный заголовок
                  - exact: "user-agent"       # Для аналитики
                  - exact: "x-forwarded-for"  # IP адрес клиента
                  - exact: "x-real-ip"        # Реальный IP
                  - exact: "host"             # Хост
          

          # gRPC JSON Transcoder — ключевой фильтр для преобразования HTTP в gRPC
          - name: envoy.filters.http.grpc_json_transcoder
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
              
              # Путь к скомпилированному proto файлу с описанием API
              proto_descriptor: "/etc/envoy/gateway_descriptor.pb"
              
              # Список gRPC сервисов, для которых включен transcoding
              services: 
                - "inventory.v1.InventoryService"
                - "user.v1.UserService"
                - "auth.v1.AuthService"
              
              # Автоматически определять gRPC-метод по HTTP-маршруту
              match_incoming_request_route: true
              
              # Настройки преобразования JSON
              print_options:
                # Добавлять пробелы в JSON для лучшей читаемости
                add_whitespace: true
                # Всегда выводить поля с примитивными типами, даже если они имеют значения по умолчанию
                always_print_primitive_fields: true
                # Использовать имена перечислений вместо числовых значений
                always_print_enums_as_ints: false
                # Сохранять имена полей в proto формате (snake_case)
                preserve_proto_field_names: true
              
              # Игнорировать неизвестные поля в JSON запросах
              ignore_unknown_query_parameters: true

          - name: envoy.filters.http.router

            typed_config: 
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router



  clusters:
  - name: order_api_cluster

    type: STRICT_DNS

    lb_policy: ROUND_ROBIN

    load_assignment:
      cluster_name: order_api_cluster

      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: order-service
                port_value: 8080

    health_checks:
    - timeout: 3s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2

      http_health_check:
        path: "/health"

  - name: inventory_api_cluster

    type: STRICT_DNS

    lb_policy: ROUND_ROBIN

    # ===============================
    # HTTP/2 НАСТРОЙКИ ДЛЯ GRPC
    # ===============================
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    # Настройки HTTP/2 обязательны для gRPC соединений

    # ===============================
    # HEALTH CHECKING
    # ===============================
    health_checks:
    - timeout: 3s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2

      grpc_health_check:
        # gRPC проверка здоровья (более подходящая для gRPC сервисов)
        service_name: "inventory.v1.Health"
        # Имя сервиса для проверки здоровья

    # ===============================
    # ENDPOINT CONFIGURATION
    # ===============================
    load_assignment:
      cluster_name: inventory_api_cluster

      endpoints:
      # Список endpoints (backend серверов)
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: inventory-service
                port_value: 50051

  - name: iam_api_cluster

    type: STRICT_DNS

    lb_policy: ROUND_ROBIN

    # ===============================
    # HTTP/2 НАСТРОЙКИ ДЛЯ GRPC
    # ===============================
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    # Настройки HTTP/2 обязательны для gRPC соединений

    # Circuit breaker для UFO сервиса - защита от перегрузки
    circuit_breakers:
      thresholds:                      # Пороговые значения для circuit breaker
      - priority: DEFAULT              # Приоритет трафика (DEFAULT, HIGH)
        max_connections: 50            # Максимум одновременных TCP соединений к upstream
        max_pending_requests: 100      # Максимум запросов в очереди ожидания
        max_requests: 1000            # Максимум активных HTTP запросов одновременно
        max_retries: 3                # Максимум одновременных retry попыток

    # ===============================
    # HEALTH CHECKING
    # ===============================
    health_checks:
    - timeout: 3s
      interval: 10s
      unhealthy_threshold: 3
      healthy_threshold: 2

      grpc_health_check:
        # gRPC проверка здоровья (более подходящая для gRPC сервисов)
        service_name: "iam.v1.Health"
        # Имя сервиса для проверки здоровья

    # ===============================
    # ENDPOINT CONFIGURATION
    # ===============================
    load_assignment:
      cluster_name: iam_api_cluster

      endpoints:
      # Список endpoints (backend серверов)
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: iam-service
                port_value: 50053

 # ⚠️ IAM gRPC Service Cluster (для External Authorization)
  - name: iam_grpc_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    
    # HTTP/2 обязательно для gRPC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options:
            # Настройки HTTP/2 для оптимальной производительности
            max_concurrent_streams: 100
            initial_stream_window_size: 65536
            initial_connection_window_size: 1048576
    
    # Connection pooling для производительности
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 10          # Ограничиваем количество соединений
        max_pending_requests: 50     # Очередь запросов
        max_requests: 100           # Максимальные активные запросы
        max_retries: 3              # Максимальные retry попытки
        track_remaining: true
    
    # Настройки соединений
    upstream_connection_options:
      tcp_keepalive:
        keepalive_probes: 3
        keepalive_time: 30
        keepalive_interval: 5
    
    # Health checking для IAM сервиса
    health_checks:
    - timeout: 1s
      interval: 5s
      unhealthy_threshold: 2
      healthy_threshold: 2
      grpc_health_check:
        service_name: "iam.v1.Health"
    
    # Endpoint IAM gRPC сервиса
    load_assignment:
      cluster_name: iam_grpc_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: iam-service      # Docker service name
                port_value: 50053         # gRPC порт IAM сервиса
  