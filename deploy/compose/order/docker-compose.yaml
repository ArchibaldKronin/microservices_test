services:
  postgres-order:
    image: postgres:15

    container_name: postgres-inventory

    environment:
      POSTGRES_DB: order-service
      POSTGRES_USER: order-service-user
      POSTGRES_PASSWORD: order-service-password

    ports:
      - 5432:5432

    volumes:
      - postgres_order_data:/var/lib/postgresql/data

    healthcheck:
        test: [
          "CMD-SHELL", "pg_isready -U order-service-user -d order-service"
        ]
        interval: 10s
        timeout: 5s
        retries: 5

    restart: unless-stopped

    networks:
      - microservices-net
  
volumes:
  postgres_order_data:

networks:
  microservices-net:
    external: true

  

  
      