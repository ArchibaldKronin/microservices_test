services:
  order-service:
    build:
      context: ../../..
      dockerfile: deploy/docker/order/Dockerfile

    container_name: order-service

    env_file:
      - .env

    environment:
      - INVENTORY_GRPC_HOST=inventory-service
      - PAYMENT_GRPC_HOST=payment-service
      - IAM_GRPC_HOST=iam-service
      - KAFKA_BROKERS=kafka:9092
      - POSTGRES_HOST=postgres-order
      - POSTGRES_PORT=5432

    depends_on:
      postgres-order:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

    networks:
      - microservices-net

  postgres-order:
    image: postgres:17.0-alpine3.20

    container_name: postgres-inventory

    env_file:
      - .env
    
    ports:
      - ${EXTERNAL_POSTGRES_PORT}:5432

    volumes:
      - postgres_order_data:/var/lib/postgresql/data

    healthcheck:
        test: [
          "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
        interval: 10s
        timeout: 5s
        retries: 5

    restart: unless-stopped

    networks:
      - microservices-net
  
volumes:
  postgres_order_data:

networks:
  microservices-net:
    external: true

  

  
      