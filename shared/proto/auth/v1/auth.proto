syntax = "proto3";

package auth.v1;

import "common/v1/user.proto";

option go_package = "github.com/ArchibaldKronin/microservices_test/shared/pkg/proto/auth/v1;auth_v1";

// API для авторизации
service AuthService {
  // Авторизоваться
  rpc Login(LoginRequest) returns (LoginResponse);

  // Получить информацию о пользователе по идентификатору сессии
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse);
}

// Запрос на аутентификацию и авторизацию
message LoginRequest {
  string login = 1;
  string password = 2;
}

// Ответ на запрос на аутентификацию и авторизацию, возвращает UUID сессии
message LoginResponse {
  string session_uuid = 1;
}

// Запрос "Кто я?" по идентификатору сессии
message WhoamiRequest {
  string session_uuid = 1;
}

// Ответ на запрос "Кто я?"
message WhoamiResponse {
  common.v1.User user = 1;
}
