syntax = "proto3";

package user.v1;

import "common/v1/user.proto";

option go_package = "github.com/ArchibaldKronin/microservices_test/shared/pkg/proto/user/v1;user_v1";

// API для работы с пользователем
service UserService {
  // Зарегистрироваться
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Получить информацию о пользователе по идентификатору пользователя
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

// // Каналы, по которым пользователь хочет получать уведомления
// message NotificationMethod {
//   // Имя провайдера (например, telegram, email, push)
//   string provider_name = 1;
//   // Адрес получателя — email, ID чата и т.д.
//   string target = 2;
// }

// Пользовательская информация
message UserInfo {
  string email = 1;
  string login = 2;
}

// Регистрационная информация
message RegistrationInfo {
  UserInfo info = 1;
  string password = 2;
}

// Запрос на регистрацию
message RegisterRequest {
  RegistrationInfo info = 1;
}

// Ответ на запрос на регистрацию
message RegisterResponse {
  string user_uuid = 1;
}

// Запрос получения данных пользователя по UUID
message GetUserRequest {
  string user_uuid = 1;
}

// Ответ на запрос получения данных пользователя по UUID
message GetUserResponse {
  common.v1.User user = 1;
}
