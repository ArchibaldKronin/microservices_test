type: object
required:
  - order_uuid
  - user_uuid
  - part_uuids
  - total_price
  - status
properties:
  order_uuid:
    type: string
    format: uuid
    description: id заказа
    example: "3f9c2a6e-7b1d-4c5a-9e8f-2a6d1c0b4f72"
  user_uuid:
    type: string
    format: uuid
    description: id пользователя
    example: "a8e1d5b3-2c47-4f9a-b6c2-9d7e3a1f5c88"
  part_uuids:
    type: array
    items:
      type: string
      format: uuid
      example: "d1a7e3c5-9b2f-4c8d-a6e1-7f3b2d9c4a55"
    description: id-шники деталей
    example: "6b4f0c92-8d3a-4e1b-9f7c-5a2d8e6c1b31"
  total_price:
    type: number
    format: float
    description: итоговая цена
    example: 99.54
  transaction_uuid:
    type: string
    format: uuid
    description: id транзакции, если оплачено
    example: "6b4f0c92-8d3a-4e1b-9f7c-5a2d8e6c1b30"
  payment_method:
    $ref: ./enums/payment_method.yaml
    description: метод оплаты, если оплачено
  status:
    $ref: ./enums/order_status.yaml
    description: статус оплаты