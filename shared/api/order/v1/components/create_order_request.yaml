type: object
required:
  - user_uuid
  - part_uuids
properties:
  user_uuid:
    type: string
    format: uuid
    description: id пользователя
    example: "3f9c2a6e-7b1d-4c5a-9e8f-2a6d1c0b4f72"
  part_uuids:
    type: array
    items:
      type: string
      format: uuid
      example: "d1a7e3c5-9b2f-4c8d-a6e1-7f3b2d9c4a55"
    description: id-шники деталей