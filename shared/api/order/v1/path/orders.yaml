post:
  summary: Create new order
  operationId: CreateOrder
  tags:
    - Order
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../create_order_request.yaml
  responses:
    '200':
      description: Заказ успешно создан
      content:
        application/json:
          schema:
            $ref: ../create_order_response.yaml
    '404':
      description: Одна или несколько деталей не найдены
      content:
        application/json:
          schema:
            $ref: ../errors/not_found_error.yaml
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../errors/generic_error.yaml
