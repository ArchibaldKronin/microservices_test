parameters:
  - $ref: ../params/order_uuid.yaml

post:
  summary: Оплатить заказ
  operationId: PayOrderByUUID
  tags: 
    - Order
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/pay_order_request.yaml
  responses:
    '200':
      description: Заказ успешно оплачен
      content:
        application/json:
          schema:
            $ref: ../components/pay_order_response.yaml
    '404':
      description: Заказ не найден
      content:
        application/json:
          schema:
            $ref: ../components/errors/not_found_error.yaml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
           $ref: ../components/errors/internal_server_error.yaml
    '503':
      description: Service unavaliable
      content:
        application/json:
          schema:
           $ref: ../components/errors/service_unavailable_error.yaml  
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: ../components/errors/generic_error.yaml